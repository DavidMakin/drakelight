name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          pip install pytest ruff
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream fakeroot
      - run: ruff check .
      - run: pytest -q
      - name: Validate desktop entry and appstream data
        run: |
          desktop-file-validate data/*.desktop
          make metainfo
          appstreamcli validate --no-net build/*.metainfo.xml
      - name: Build .deb
        run: |
          bash packaging/build-deb.sh
          dpkg-deb -I dist/*.deb
