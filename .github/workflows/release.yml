name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' drakelight/__init__.py)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match drakelight/__init__.py version v${version}" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-dev libadwaita-1-dev \
            desktop-file-utils appstream fakeroot rpm ruby ruby-dev build-essential curl file python3-pytest
          sudo gem install --no-document fpm -v 1.16.0

      - name: Test
        run: python3 -m pytest -q

      - name: Source tarball (.tar.gz)
        run: make dist

      - name: Debian package (.deb)
        run: bash packaging/build-deb.sh

      - name: RPM package (.rpm)
        run: bash packaging/build-rpm.sh

      - name: AppImage
        run: bash packaging/build-appimage.sh

      - name: Smoke-test the AppImage and the .deb
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Drakelight-*-x86_64.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Drakelight-*-x86_64.AppImage check
          sudo apt-get install -y ./dist/drakelight_*_all.deb
          drakelight --version
          drakelight check
          test -f /usr/share/applications/io.github.davidmakin.Drakelight.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.davidmakin.Drakelight.svg

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist

      - name: Build changelog
        run: |
          PREV=$(git tag --sort=-version:refname | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)
          RANGE="${PREV:+${PREV}..}${GITHUB_REF_NAME}"
          git log "${RANGE}" --pretty=format:"%s" --no-merges > /tmp/commits.txt || true

          FEATURES=$(grep "^feat" /tmp/commits.txt | sed "s/^/- /" || true)
          FIXES=$(grep "^fix" /tmp/commits.txt | sed "s/^/- /" || true)
          MAINTENANCE=$(grep -Ev "^feat|^fix|^chore|^ci:|^build:|^style:" /tmp/commits.txt | sed "s/^/- /" || true)

          {
            [ -z "${FEATURES}" ] || printf "## 🚀 Features\n%s\n\n" "${FEATURES}"
            [ -z "${FIXES}" ] || printf "## 🐛 Bug Fixes\n%s\n\n" "${FIXES}"
            [ -z "${MAINTENANCE}" ] || printf "## 🧰 Maintenance\n%s\n\n" "${MAINTENANCE}"
            printf "## 📦 Downloads\nSee the README for install instructions. Verify downloads with \`SHA256SUMS\`.\n"
          } > notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" &>/dev/null; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --notes-file notes.md
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md
          fi
