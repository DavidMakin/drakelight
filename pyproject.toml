[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drakelight"
dynamic = ["version"]
description = "Keyboard lighting control for the Redragon K631"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

[dependency-groups]
dev = ["ruff>=0.17.4", "pytest>=8.0", "mypy>=1.13"]

[project.scripts]
drakelight = "drakelight.cli:main"

[tool.setuptools]
packages = ["drakelight"]

[tool.setuptools.dynamic]
version = { attr = "drakelight.__version__" }

[tool.setuptools.package-data]
drakelight = ["data/*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
per-file-ignores = { "drakelight/gui_gtk.py" = ["E402"], "drakelight/cli.py" = ["E402"] }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["drakelight"]

[[tool.mypy.overrides]]
module = ["gi", "gi.*", "cairo"]
ignore_missing_imports = true
